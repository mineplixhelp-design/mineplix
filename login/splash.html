<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mineplay Splash Screen</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      box-shadow: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    .splash-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .splash-gif {
      max-width: 260px;
      height: auto;
      object-fit: contain;
      transform: translateY(-30px);
    }

    .footer-branding {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .footer-text {
      color: #8e8e8e;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    .footer-icon {
      height: 24px;
      width: auto;
      object-fit: contain;
    }

    .splash-container.fade-out {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body>

  <div class="splash-container" id="splashScreen">
    <img src="img/minenime.png" alt="Splash Animation" class="splash-gif">

    <div class="footer-branding">
      <span class="footer-text">from</span>
      <img src="img/icon.png" alt="Icon" class="footer-icon">
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCdZkTVOW_TrOiKtsYwojUI5GHHVh_ZMwk",
      authDomain: "mineplix-3d91c.firebaseapp.com",
      databaseURL: "https://mineplix-3d91c-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "mineplix-3d91c",
      storageBucket: "mineplix-3d91c.firebasestorage.app",
      messagingSenderId: "932702850146",
      appId: "1:932702850146:web:0933bde133e94b4254953b",
      measurementId: "G-VTMMJV3HY7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.addEventListener("DOMContentLoaded", async () => {
      const splashScreen = document.getElementById("splashScreen");
      const loadingDuration = 1500; // Durasi animasi splash 1.5 detik

      // 1. TUNGGU SESI FIREBASE SELESAI DIMUAT DARI STORAGE (Mencegah false null)
      await auth.authStateReady();
      const user = auth.currentUser;

      setTimeout(() => {
        splashScreen.classList.add("fade-out");

        setTimeout(() => {
          if (window.Android) {
            if (user) {
              // Jika SUDAH login -> Langsung meluncur ke MainActivity tanpa buka tab
              window.Android.goToMain();
            } else {
              // Jika BENAR-BENAR BELUM login -> Buka Chrome Custom Tab
              window.Android.openLoginTab("https://mineplix.biz.id/login/");
            }
          }
        }, 500);

      }, loadingDuration);
    });
  </script>
</body>
</html>
