<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Mineplix</title>
    <meta name="description" content="Masuk ke akun Mineplix Anda untuk mengakses panel dan layanan server Minecraft.">
    
    <link rel="icon" href="../publick/img/icon.png" type="image/png">
    <link rel="preload" href="https://op.al/fonts/DieGrotesk-C-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="https://op.al/fonts/DieGrotesk-C-Bold.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="stylesheet" href="../publick/css/style.css?v=1.4">
</head>
<body>

    <div class="login-container">
        <div class="login-card fade-up visible">
            <h1>Masuk ke Mineplix</h1>
            <p>Gunakan akun Google Anda untuk melanjutkan ke panel dan layanan.</p>
            
            <button class="google-login-btn" id="googleLoginBtn" type="button">
                <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v2.39h3.88c2.27-2.09 3.66-5.17 3.66-8.82z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.02c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.95H1.2v3.13C3.18 21.36 7.23 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.28c-.25-.72-.39-1.5-.39-2.28s.14-1.56.39-2.28V6.59H1.2C.44 8.13 0 9.87 0 12s.44 3.87 1.2 5.41l4.08-3.13z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.18 2.64 1.2 6.59l4.08 3.13c.95-2.84 3.6-4.97 6.72-4.97z"/>
                </svg>
                <span id="loginBtnText">Masuk dengan Google</span>
            </button>

            <a href="/" class="back-home">← Kembali ke Beranda</a>
        </div>
    </div>

    <script type="module" src="../publick/js/login.js?v=1.4"></script>
</body>
</html>
