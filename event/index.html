<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Page | Night Workshop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <span class="badge">Workshop Terdekat</span>
            <h1>Membangun Masa Depan Digital</h1>
            <p class="subtitle">Bergabunglah dalam sesi eksklusif membahas tren teknologi 2025.</p>
        </header>

        <main class="event-card">
            <div class="event-info">
                <div class="info-item">
                    <strong>Tanggal</strong>
                    <span>20 Januari 2025</span>
                </div>
                <div class="info-item">
                    <strong>Waktu</strong>
                    <span>19:00 - 21:00 WIB</span>
                </div>
                <div class="info-item">
                    <strong>Lokasi</strong>
                    <span>Zoom Meeting (Online)</span>
                </div>
            </div>

            <button id="registerBtn" class="btn-primary">Daftar Sekarang</button>
        </main>

        <div id="statusMessage" class="hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
